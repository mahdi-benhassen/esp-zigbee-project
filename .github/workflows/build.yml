name: Build Zigbee Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Build All Firmware Binaries in One Container
  # ─────────────────────────────────────────────
  build-all:
    name: "Build All Firmware Binaries"
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive https://github.com/espressif/esp-zigbee-sdk.git

      - name: Build RCP (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh
          
          cd $IDF_PATH/examples/openthread/ot_rcp
          idf.py set-target esp32h2
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/rcp
          cp build/ot_rcp.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true

      - name: Build Gateway (ESP32-S3)
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/esp_zigbee_gateway
          idf.py set-target esp32s3
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/gateway
          cp build/esp_zigbee_gateway.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-firmware-binaries
          path: build_artifacts/
          retention-days: 7