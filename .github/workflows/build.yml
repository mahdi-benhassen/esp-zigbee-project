name: Build Zigbee Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IDF_VERSION: v5.3.1
  ZIGBEE_SDK_REPO: https://github.com/espressif/esp-zigbee-sdk.git

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build RCP firmware (esp32h2)
  #          Required before Gateway firmware
  # ─────────────────────────────────────────────
  build-rcp:
    name: "RCP Firmware (ESP32-H2)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build RCP firmware via ESP-IDF action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32h2
          # ot_rcp lives inside IDF itself, not the zigbee SDK
          path: ""
          command: >
            cd $IDF_PATH/examples/openthread/ot_rcp &&
            cp $GITHUB_WORKSPACE/config/rcp/sdkconfig.defaults . &&
            idf.py set-target esp32h2 &&
            idf.py build

      # Upload the compiled RCP binary so the Gateway job can grab it
      - name: Upload RCP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcp-firmware
          path: |
            /root/esp/idf/examples/openthread/ot_rcp/build/ot_rcp.bin
            /root/esp/idf/examples/openthread/ot_rcp/build/bootloader/bootloader.bin
            /root/esp/idf/examples/openthread/ot_rcp/build/partition_table/partition-table.bin
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2 — Build Gateway firmware (esp32s3)
  # ─────────────────────────────────────────────
  build-gateway:
    name: "Gateway Firmware (ESP32-S3)"
    runs-on: ubuntu-latest
    needs: build-rcp          # wait for RCP build to succeed first

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone ESP-Zigbee-SDK
        run: |
          git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy Gateway sdkconfig.defaults
        run: |
          cp config/gateway/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_gateway/

      - name: Build Gateway firmware via ESP-IDF action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: esp-zigbee-sdk/examples/esp_zigbee_gateway

      - name: Upload Gateway build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            esp-zigbee-sdk/examples/esp_zigbee_gateway/build/esp_zigbee_gateway.bin
            esp-zigbee-sdk/examples/esp_zigbee_gateway/build/bootloader/bootloader.bin
            esp-zigbee-sdk/examples/esp_zigbee_gateway/build/partition_table/partition-table.bin
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3 — Build NCP firmware (esp32h2)
  # ─────────────────────────────────────────────
  build-ncp:
    name: "NCP Firmware (ESP32-H2)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone ESP-Zigbee-SDK
        run: |
          git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy NCP sdkconfig.defaults
        run: |
          cp config/ncp/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_ncp/

      - name: Build NCP firmware via ESP-IDF action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32h2
          path: esp-zigbee-sdk/examples/esp_zigbee_ncp

      - name: Upload NCP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncp-firmware
          path: |
            esp-zigbee-sdk/examples/esp_zigbee_ncp/build/esp_zigbee_ncp.bin
            esp-zigbee-sdk/examples/esp_zigbee_ncp/build/bootloader/bootloader.bin
            esp-zigbee-sdk/examples/esp_zigbee_ncp/build/partition_table/partition-table.bin
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4 — Build HOST firmware (esp32s3)
  # ─────────────────────────────────────────────
  build-host:
    name: "HOST Firmware (ESP32-S3)"
    runs-on: ubuntu-latest
    needs: build-ncp          # NCP must compile cleanly before host

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone ESP-Zigbee-SDK
        run: |
          git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy HOST sdkconfig.defaults
        run: |
          cp config/host/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_host/

      - name: Build HOST firmware via ESP-IDF action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: esp-zigbee-sdk/examples/esp_zigbee_host

      - name: Upload HOST build artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-firmware
          path: |
            esp-zigbee-sdk/examples/esp_zigbee_host/build/esp_zigbee_host.bin
            esp-zigbee-sdk/examples/esp_zigbee_host/build/bootloader/bootloader.bin
            esp-zigbee-sdk/examples/esp_zigbee_host/build/partition_table/partition-table.bin
          retention-days: 7
