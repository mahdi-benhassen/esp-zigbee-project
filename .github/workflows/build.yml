name: Build Zigbee Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege: this workflow only builds and uploads artifacts, it does not
# push to the repo or create releases.
permissions:
  contents: read

# Cancel superseded runs on the same ref (avoids redundant CI on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────
  # Build All Firmware Binaries in One Container
  # ─────────────────────────────────────────────
  build-all:
    name: "Build All Firmware Binaries"
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive https://github.com/espressif/esp-zigbee-sdk.git

      - name: Prepare utils for node builds
        run: |
          # Copy the 'utils' folder from the cloned SDK to the workspace root.
          # This satisfies the "../../../utils/..." relative paths in node idf_component.yml files.
          cp -r $(find ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples -type d -name "utils") ${GITHUB_WORKSPACE}/

      - name: Build RCP (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh
          
          cd $IDF_PATH/examples/openthread/ot_rcp
          cat ${GITHUB_WORKSPACE}/config/rcp/sdkconfig.defaults >> sdkconfig.defaults
          idf.py set-target esp32h2
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/rcp
          cp build/esp_ot_rcp.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/rcp/ || true

      - name: Build Gateway (ESP32-S3)
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/zigbee_gateway
          cat ${GITHUB_WORKSPACE}/config/gateway/sdkconfig.defaults >> sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/gateway
          cp build/zigbee_gateway.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/gateway/ || true

      - name: Build Node Temp Sensor (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_temp_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy artifacts
          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/node_temp_sensor
          cp build/temperature_sensor.bin ${GITHUB_WORKSPACE}/build_artifacts/node_temp_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/node_temp_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/node_temp_sensor/ || true

      - name: Build Node Light Sensor (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_light_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy artifacts
          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/node_light_sensor
          cp build/light_sensor.bin ${GITHUB_WORKSPACE}/build_artifacts/node_light_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/node_light_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/node_light_sensor/ || true

      - name: Build Node Gas Sensor (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_gas_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy artifacts
          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/node_gas_sensor
          cp build/gas_sensor.bin ${GITHUB_WORKSPACE}/build_artifacts/node_gas_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/node_gas_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/node_gas_sensor/ || true

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-firmware-binaries
          path: build_artifacts/
          retention-days: 7