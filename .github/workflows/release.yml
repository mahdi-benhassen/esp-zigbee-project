name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'    # trigger on tags like v1.0.0, v1.2.3

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build and Package All Firmware
  # ─────────────────────────────────────────────
  build-and-package:
    name: "Build and Package Binaries"
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip utility
        run: apt-get update && apt-get install -y zip

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive https://github.com/espressif/esp-zigbee-sdk.git

      - name: Prepare utils for node builds
        run: |
          # Copy the 'utils' folder from the cloned SDK to the workspace root.
          # This satisfies the "../../../utils/..." relative paths in node idf_component.yml files.
          cp -r $(find ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples -type d -name "utils") ${GITHUB_WORKSPACE}/

      - name: Build and Package RCP
        run: |
          . /opt/esp/idf/export.sh
          
          cd $IDF_PATH/examples/openthread/ot_rcp
          cat ${GITHUB_WORKSPACE}/config/rcp/sdkconfig.defaults >> sdkconfig.defaults
          idf.py set-target esp32h2
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/rcp
          cp build/esp_ot_rcp.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r rcp-firmware-${{ github.ref_name }}.zip rcp/

      - name: Build and Package Gateway
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/zigbee_gateway
          cat ${GITHUB_WORKSPACE}/config/gateway/sdkconfig.defaults >> sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/gateway
          cp build/zigbee_gateway.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r gateway-firmware-${{ github.ref_name }}.zip gateway/

      - name: Build and Package Node Temp Sensor
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_temp_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy and package artifacts
          mkdir -p ${GITHUB_WORKSPACE}/release/node_temp_sensor
          cp build/temperature_sensor.bin ${GITHUB_WORKSPACE}/release/node_temp_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/node_temp_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/node_temp_sensor/ || true

          cd ${GITHUB_WORKSPACE}/release
          zip -r node_temp_sensor-firmware-${{ github.ref_name }}.zip node_temp_sensor/

      - name: Build and Package Node Light Sensor
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_light_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy and package artifacts
          mkdir -p ${GITHUB_WORKSPACE}/release/node_light_sensor
          cp build/light_sensor.bin ${GITHUB_WORKSPACE}/release/node_light_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/node_light_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/node_light_sensor/ || true

          cd ${GITHUB_WORKSPACE}/release
          zip -r node_light_sensor-firmware-${{ github.ref_name }}.zip node_light_sensor/

      - name: Build and Package Node Gas Sensor
        run: |
          . /opt/esp/idf/export.sh

          # Navigate into the standalone node project directory
          cd ${GITHUB_WORKSPACE}/config/node_gas_sensor
          idf.py set-target esp32h2
          idf.py build

          # Copy and package artifacts
          mkdir -p ${GITHUB_WORKSPACE}/release/node_gas_sensor
          cp build/gas_sensor.bin ${GITHUB_WORKSPACE}/release/node_gas_sensor/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/node_gas_sensor/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/node_gas_sensor/ || true

          cd ${GITHUB_WORKSPACE}/release
          zip -r node_gas_sensor-firmware-${{ github.ref_name }}.zip node_gas_sensor/

      - name: Upload Release Zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/*.zip
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 — Publish GitHub Release
  # ─────────────────────────────────────────────
  publish-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: write

    steps:
      - name: Download firmware zips
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/rcp-firmware-${{ github.ref_name }}.zip
            release-assets/gateway-firmware-${{ github.ref_name }}.zip
            release-assets/node_temp_sensor-firmware-${{ github.ref_name }}.zip
            release-assets/node_light_sensor-firmware-${{ github.ref_name }}.zip
            release-assets/node_gas_sensor-firmware-${{ github.ref_name }}.zip
          body: |
            ## ESP Zigbee Firmware ${{ github.ref_name }}

            ### Included Firmware Packages
            | File | Target Chip | Role |
            |---|---|---|
            | `rcp-firmware-*.zip` | ESP32-H2 | Radio Co-Processor for Gateway |
            | `gateway-firmware-*.zip` | ESP32-S3 (CoreS3) | Zigbee ↔ Wi-Fi Gateway |
            | `node_temp_sensor-firmware-*.zip` | ESP32-H2 | Zigbee End Device (Temperature Sensor) |
            | `node_light_sensor-firmware-*.zip` | ESP32-H2 | Zigbee End Device (Light Sensor) |
            | `node_gas_sensor-firmware-*.zip` | ESP32-H2 | Zigbee End Device (Ammonia & CO2 Gas Sensor) |

            ### Flashing
            ```bash
            idf.py erase_flash
            idf.py flash --port /dev/ttyUSB0
            ```
            See `README.md` for full flashing instructions.