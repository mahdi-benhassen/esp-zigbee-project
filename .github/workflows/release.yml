name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'    # trigger on tags like v1.0.0, v1.2.3

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build and Package All Firmware
  # ─────────────────────────────────────────────
  build-and-package:
    name: "Build and Package Binaries"
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip utility
        run: apt-get update && apt-get install -y zip

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive https://github.com/espressif/esp-zigbee-sdk.git

      - name: Build and Package RCP
        run: |
          . /opt/esp/idf/export.sh
          
          cd $IDF_PATH/examples/openthread/ot_rcp
          idf.py set-target esp32h2
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/rcp
          cp build/ot_rcp.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/rcp/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r rcp-firmware-${{ github.ref_name }}.zip rcp/

      - name: Build and Package Gateway
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/esp_zigbee_gateway
          idf.py set-target esp32s3
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/gateway
          cp build/esp_zigbee_gateway.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/gateway/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r gateway-firmware-${{ github.ref_name }}.zip gateway/

      - name: Build and Package NCP
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/esp_zigbee_ncp
          idf.py set-target esp32h2
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/ncp
          cp build/esp_zigbee_ncp.bin ${GITHUB_WORKSPACE}/release/ncp/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/ncp/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/ncp/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r ncp-firmware-${{ github.ref_name }}.zip ncp/

      - name: Build and Package HOST
        run: |
          . /opt/esp/idf/export.sh
          
          cd ${GITHUB_WORKSPACE}/esp-zigbee-sdk/examples/esp_zigbee_host
          idf.py set-target esp32s3
          idf.py build

          mkdir -p ${GITHUB_WORKSPACE}/release/host
          cp build/esp_zigbee_host.bin ${GITHUB_WORKSPACE}/release/host/ || true
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/release/host/ || true
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/release/host/ || true
          
          cd ${GITHUB_WORKSPACE}/release
          zip -r host-firmware-${{ github.ref_name }}.zip host/

      - name: Upload Release Zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/*.zip
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 — Publish GitHub Release
  # ─────────────────────────────────────────────
  publish-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: write

    steps:
      - name: Download firmware zips
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/rcp-firmware-${{ github.ref_name }}.zip
            release-assets/gateway-firmware-${{ github.ref_name }}.zip
            release-assets/ncp-firmware-${{ github.ref_name }}.zip
            release-assets/host-firmware-${{ github.ref_name }}.zip
          body: |
            ## ESP Zigbee Firmware ${{ github.ref_name }}

            ### Included Firmware Packages
            | File | Target Chip | Role |
            |---|---|---|
            | `rcp-firmware-*.zip` | ESP32-H2 | Radio Co-Processor for Gateway |
            | `gateway-firmware-*.zip` | ESP32-S3 (CoreS3) | Zigbee ↔ Wi-Fi Gateway |
            | `ncp-firmware-*.zip` | ESP32-H2 (Module Gateway H2) | Zigbee Network Co-Processor |
            | `host-firmware-*.zip` | ESP32-S3 (CoreS3) | NCP Host / Coordinator |

            ### Flashing
            ```bash
            idf.py erase_flash
            idf.py flash --port /dev/ttyUSB0
            ```
            See `README.md` for full flashing instructions.