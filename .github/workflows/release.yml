name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'    # trigger on tags like v1.0.0, v1.2.3

env:
  IDF_VERSION: v5.3.1
  ZIGBEE_SDK_REPO: https://github.com/espressif/esp-zigbee-sdk.git

jobs:
  # ─────────────────────────────────────────────
  # Build RCP (needed by Gateway)
  # ─────────────────────────────────────────────
  release-rcp:
    name: "Release RCP (ESP32-H2)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build RCP firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32h2
          path: ""
          command: >
            cd $IDF_PATH/examples/openthread/ot_rcp &&
            cp $GITHUB_WORKSPACE/config/rcp/sdkconfig.defaults . &&
            idf.py set-target esp32h2 &&
            idf.py build

      - name: Package RCP binaries
        run: |
          mkdir -p release/rcp
          cp /root/esp/idf/examples/openthread/ot_rcp/build/ot_rcp.bin              release/rcp/
          cp /root/esp/idf/examples/openthread/ot_rcp/build/bootloader/bootloader.bin release/rcp/
          cp /root/esp/idf/examples/openthread/ot_rcp/build/partition_table/partition-table.bin release/rcp/
          cd release && zip -r ../rcp-firmware-${{ github.ref_name }}.zip rcp/

      - uses: actions/upload-artifact@v4
        with:
          name: release-rcp
          path: rcp-firmware-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────
  # Build Gateway
  # ─────────────────────────────────────────────
  release-gateway:
    name: "Release Gateway (ESP32-S3)"
    runs-on: ubuntu-latest
    needs: release-rcp

    steps:
      - uses: actions/checkout@v4

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy sdkconfig
        run: cp config/gateway/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_gateway/

      - name: Build Gateway firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: esp-zigbee-sdk/examples/esp_zigbee_gateway

      - name: Package Gateway binaries
        run: |
          mkdir -p release/gateway
          cp esp-zigbee-sdk/examples/esp_zigbee_gateway/build/esp_zigbee_gateway.bin          release/gateway/
          cp esp-zigbee-sdk/examples/esp_zigbee_gateway/build/bootloader/bootloader.bin        release/gateway/
          cp esp-zigbee-sdk/examples/esp_zigbee_gateway/build/partition_table/partition-table.bin release/gateway/
          cd release && zip -r ../gateway-firmware-${{ github.ref_name }}.zip gateway/

      - uses: actions/upload-artifact@v4
        with:
          name: release-gateway
          path: gateway-firmware-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────
  # Build NCP
  # ─────────────────────────────────────────────
  release-ncp:
    name: "Release NCP (ESP32-H2)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy sdkconfig
        run: cp config/ncp/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_ncp/

      - name: Build NCP firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32h2
          path: esp-zigbee-sdk/examples/esp_zigbee_ncp

      - name: Package NCP binaries
        run: |
          mkdir -p release/ncp
          cp esp-zigbee-sdk/examples/esp_zigbee_ncp/build/esp_zigbee_ncp.bin               release/ncp/
          cp esp-zigbee-sdk/examples/esp_zigbee_ncp/build/bootloader/bootloader.bin          release/ncp/
          cp esp-zigbee-sdk/examples/esp_zigbee_ncp/build/partition_table/partition-table.bin release/ncp/
          cd release && zip -r ../ncp-firmware-${{ github.ref_name }}.zip ncp/

      - uses: actions/upload-artifact@v4
        with:
          name: release-ncp
          path: ncp-firmware-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────
  # Build HOST
  # ─────────────────────────────────────────────
  release-host:
    name: "Release HOST (ESP32-S3)"
    runs-on: ubuntu-latest
    needs: release-ncp

    steps:
      - uses: actions/checkout@v4

      - name: Clone ESP-Zigbee-SDK
        run: git clone --recursive ${{ env.ZIGBEE_SDK_REPO }} esp-zigbee-sdk

      - name: Copy sdkconfig
        run: cp config/host/sdkconfig.defaults esp-zigbee-sdk/examples/esp_zigbee_host/

      - name: Build HOST firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: esp-zigbee-sdk/examples/esp_zigbee_host

      - name: Package HOST binaries
        run: |
          mkdir -p release/host
          cp esp-zigbee-sdk/examples/esp_zigbee_host/build/esp_zigbee_host.bin              release/host/
          cp esp-zigbee-sdk/examples/esp_zigbee_host/build/bootloader/bootloader.bin         release/host/
          cp esp-zigbee-sdk/examples/esp_zigbee_host/build/partition_table/partition-table.bin release/host/
          cd release && zip -r ../host-firmware-${{ github.ref_name }}.zip host/

      - uses: actions/upload-artifact@v4
        with:
          name: release-host
          path: host-firmware-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────
  # Publish GitHub Release — runs after ALL builds
  # ─────────────────────────────────────────────
  publish-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [release-rcp, release-gateway, release-ncp, release-host]
    permissions:
      contents: write

    steps:
      - name: Download all firmware zips
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/rcp-firmware-${{ github.ref_name }}.zip
            release-assets/gateway-firmware-${{ github.ref_name }}.zip
            release-assets/ncp-firmware-${{ github.ref_name }}.zip
            release-assets/host-firmware-${{ github.ref_name }}.zip
          body: |
            ## ESP Zigbee Firmware ${{ github.ref_name }}

            ### Included Firmware Packages
            | File | Target Chip | Role |
            |---|---|---|
            | `rcp-firmware-*.zip` | ESP32-H2 | Radio Co-Processor for Gateway |
            | `gateway-firmware-*.zip` | ESP32-S3 (CoreS3) | Zigbee ↔ Wi-Fi Gateway |
            | `ncp-firmware-*.zip` | ESP32-H2 (Module Gateway H2) | Zigbee Network Co-Processor |
            | `host-firmware-*.zip` | ESP32-S3 (CoreS3) | NCP Host / Coordinator |

            ### Flashing
            ```bash
            idf.py erase_flash
            idf.py flash --port /dev/ttyUSB0
            ```
            See `README.md` for full flashing instructions.
